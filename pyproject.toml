[project]
name = "clipboardmess"
version = "0.1.0"
description = "Occasionally replace clipboard text with a random prompt"
readme = "README.md"
authors = [
    { name = "Dawid Kohnke", email = "dawid.kohnke@kgsolutions.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pyperclip>=1.11.0",
]

[project.scripts]
clipboardmess = "clipboardmess.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21,<7; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
